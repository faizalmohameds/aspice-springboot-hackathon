
name: Spring Boot ASPICE CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # ==========================================
  # JOB 1: MAVEN BUILD
  # ==========================================

  maven-build:
    name: 1 - Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Package
        run: mvn -B clean package -DskipTests

      - name: Verify JAR
        run: test -n "$(find target -maxdepth 1 -name '*.jar' -print -quit)"

      - name: Upload Application JAR
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Application-JAR
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7


  # ==========================================
  # JOB 2: JUNIT + JACOCO
  # ==========================================

  unit-test:
    name: 2 - JUnit and JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Tests and Coverage
        run: mvn -B clean verify

      - name: Check Test Reports
        if: always()
        run: |
          echo "=== Test source files ==="
          find src/test -type f -name "*.java" -print || true

          echo "=== Compiled test classes ==="
          find target/test-classes -type f -name "*.class" -print || true

          echo "=== Surefire reports ==="
          find target/surefire-reports -type f -print || true

          echo "=== Failsafe reports ==="
          find target/failsafe-reports -type f -print || true

          echo "=== JaCoCo reports ==="
          find target/site/jacoco -type f -print || true

      - name: Verify JUnit XML Reports
        if: success()
        run: |
          if ! find target/surefire-reports target/failsafe-reports \
            -type f -name "TEST-*.xml" -print -quit 2>/dev/null | grep -q .; then
            echo "ERROR: No JUnit XML reports generated."
            exit 1
          fi

      - name: Publish JUnit Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Test Results
          path: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Test and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Test-Reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/classes/
            target/test-classes/
          if-no-files-found: warn
          retention-days: 90


  # ==========================================
  # JOB 3: SONARCLOUD ANALYSIS
  # ==========================================

  sonarqube:
    name: 3 - SonarQube Analysis
    runs-on: ubuntu-latest
    environment: Dev
    needs: unit-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download Test and Coverage Reports
        uses: actions/download-artifact@v4
        with:
          name: ASPICE-Test-Reports
          path: target

      - name: Verify JaCoCo Report
        run: |
          test -f target/site/jacoco/jacoco.xml || {
            echo "JaCoCo XML report not found."
            exit 1
          }

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      # Download SonarCloud measures and Quality Gate status.
      # if: always() also allows collection when the Quality Gate fails.

      - name: Download SonarCloud Report Data
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail

          mkdir -p sonar-evidence

          curl --fail --silent --show-error \
            -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/measures/component?component=$SONAR_PROJECT_KEY&metricKeys=coverage,bugs,vulnerabilities,code_smells,security_hotspots,duplicated_lines_density" \
            -o sonar-evidence/sonar-measures.json

          curl --fail --silent --show-error \
            -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY" \
            -o sonar-evidence/sonar-quality-gate.json

          echo "SonarCloud report data downloaded."
          ls -lh sonar-evidence/

      - name: Upload SonarCloud Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Sonar-Reports
          path: sonar-evidence/
          if-no-files-found: warn
          retention-days: 90


  # ==========================================
  # JOB 4: TRIVY FILESYSTEM SCAN
  # ==========================================

  trivy-fs:
    name: 4 - Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-fs-results.json
          exit-code: '0'

      - name: Upload Filesystem Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Trivy-Filesystem
          path: trivy-fs-results.json
          if-no-files-found: warn
          retention-days: 90


  # ==========================================
  # JOB 5: DOCKER BUILD
  # ==========================================

  docker-build:
    name: 5 - Docker Image Build
    runs-on: ubuntu-latest
    needs: maven-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Application JAR
        uses: actions/download-artifact@v4
        with:
          name: ASPICE-Application-JAR
          path: target

      - name: Docker Build
        run: |
          IMAGE="${IMAGE_NAME,,}"
          TAG="${GITHUB_SHA}"

          docker build -t "$IMAGE:$TAG" .

          docker save "$IMAGE:$TAG" -o aspice-docker-image.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Docker-Image
          path: aspice-docker-image.tar
          retention-days: 2


  # ==========================================
  # JOB 6: TRIVY DOCKER IMAGE SCAN
  # ==========================================

  trivy-image:
    name: 6 - Trivy Docker Image Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: ASPICE-Docker-Image
          path: image

      - name: Load Docker Image
        run: docker load -i image/aspice-docker-image.tar

      - name: Set Lowercase Image Name
        id: image-name
        run: |
          echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image-name.outputs.image }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image-results.json
          exit-code: '0'

      - name: Upload Image Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Trivy-Image
          path: trivy-image-results.json
          if-no-files-found: warn
          retention-days: 90


  # ==========================================
  # JOB 7: DOCKER PUSH TO GHCR
  # ==========================================

  docker-push:
    name: 7 - Docker Image Push
    runs-on: ubuntu-latest

    needs:
      - docker-build
      - trivy-image

    if: >-
      github.event_name != 'pull_request' &&
      needs.docker-build.result == 'success' &&
      needs.trivy-image.result == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: ASPICE-Docker-Image
          path: image

      - name: Load Docker Image
        run: docker load -i image/aspice-docker-image.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push "${IMAGE_NAME,,}:${GITHUB_SHA}"


  # ==========================================
  # JOB 8: ASPICE REPORT GENERATION
  # ==========================================

  aspice-report:
    name: 8 - ASPICE Evidence Report
    runs-on: ubuntu-latest

    if: always()

    needs:
      - maven-build
      - unit-test
      - sonarqube
      - trivy-fs
      - docker-build
      - trivy-image
      - docker-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ASPICE Report Generator
        run: |
          python3 --version

          if [ ! -f scripts/generate_aspice_report.py ]; then
            echo "ERROR: scripts/generate_aspice_report.py not found."
            exit 1
          fi

          echo "ASPICE report generator found."

      # Download only the reports needed by the dashboard.
      # Do not download the Docker image TAR into the evidence directory.

      - name: Download Test and Coverage Evidence
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ASPICE-Test-Reports
          path: evidence/tests

      - name: Download Trivy Evidence
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ASPICE-Trivy-*
          path: evidence/trivy
          merge-multiple: false

      - name: Download SonarCloud Evidence
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ASPICE-Sonar-Reports
          path: evidence/sonar

      - name: Display Downloaded Evidence
        if: always()
        run: |
          echo "=== Downloaded ASPICE Evidence ==="
          find evidence -type f -print || true

      - name: Generate ASPICE HTML Report
        env:
          BUILD_RESULT: ${{ needs.maven-build.result }}
          TEST_RESULT: ${{ needs.unit-test.result }}
          SONAR_RESULT: ${{ needs.sonarqube.result }}
          TRIVY_FS_RESULT: ${{ needs.trivy-fs.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          TRIVY_IMAGE_RESULT: ${{ needs.trivy-image.result }}
          DOCKER_PUSH_RESULT: ${{ needs.docker-push.result }}
        run: |
          python3 scripts/generate_aspice_report.py

          echo "=== Generated ASPICE Report ==="
          ls -lh aspice-report/

      - name: Publish ASPICE Report in GitHub Actions Summary
        if: always()
        env:
          BUILD_RESULT: ${{ needs.maven-build.result }}
          TEST_RESULT: ${{ needs.unit-test.result }}
          SONAR_RESULT: ${{ needs.sonarqube.result }}
          TRIVY_FS_RESULT: ${{ needs.trivy-fs.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          TRIVY_IMAGE_RESULT: ${{ needs.trivy-image.result }}
          DOCKER_PUSH_RESULT: ${{ needs.docker-push.result }}
        run: |
          {
            echo "# ASPICE Evidence Report"
            echo ""
            echo "| CI Stage | Result |"
            echo "|---|---|"
            echo "| Maven Build | $BUILD_RESULT |"
            echo "| Unit Tests and JaCoCo | $TEST_RESULT |"
            echo "| SonarCloud | $SONAR_RESULT |"
            echo "| Trivy Filesystem | $TRIVY_FS_RESULT |"
            echo "| Docker Build | $DOCKER_BUILD_RESULT |"
            echo "| Trivy Image | $TRIVY_IMAGE_RESULT |"
            echo "| Docker Push | $DOCKER_PUSH_RESULT |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f aspice-report/aspice-report.html ]; then
            echo "ASPICE HTML dashboard generated successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "Download the ASPICE-Final-Report artifact to view the full dashboard." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: aspice-report/aspice-report.html was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Final ASPICE Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASPICE-Final-Report
          path: |
            aspice-report/
            evidence/
          if-no-files-found: warn
          retention-days: 90

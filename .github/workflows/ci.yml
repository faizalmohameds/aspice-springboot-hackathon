
name: Spring Boot CI - ASPICE Hackathon

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build-test:
    name: Build and unit test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Configure Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build and execute unit tests
      - name: Compile, test and package
        run: mvn -B clean verify

      # 4. Upload test reports
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      # 5. Build Docker image
      - name: Build Docker image
        run: docker build --tag aspice-demo:${{ github.sha }} .

      # 6. Scan Docker image for vulnerabilities
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: aspice-demo:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


  publish-image:
    name: Publish image to GitHub Container Registry
    needs: build-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build and publish Docker image
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aspice-demo:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aspice-demo:latest
